<section class="hero">
    <h1>Личный кабинет: {{ profile.get_role_display|lower }}</h1>
    <p>{{ user.first_name|default:user.username }}{% if profile.city %} · {{ profile.city }}{% endif %}</p>
    <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="button secondary small">Выйти из кабинета</button>
    </form>
</section>
