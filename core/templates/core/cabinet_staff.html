{% extends 'core/base.html' %}
{% block content %}
<section class="hero">
    <h1>Служебная учётная запись</h1>
    <p>У этой учётной записи нет роли участника. Управление сайтом — в панели администратора.</p>
    {% if user.is_staff %}<a href="/admin/" class="button">Открыть админ-панель</a>{% endif %}
    <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="button secondary">Выйти</button>
    </form>
</section>
{% endblock %}
